syntax = "proto3";

package concord.common.v1;

option go_package = "github.com/Alexander-D-Karpov/concord/api/gen/go/common/v1;commonv1";

import "google/protobuf/timestamp.proto";

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_MEMBER = 1;
  ROLE_MODERATOR = 2;
  ROLE_ADMIN = 3;
}

message User {
  string id = 1;
  string handle = 2;
  string display_name = 3;
  string avatar_url = 4;
  google.protobuf.Timestamp created_at = 5;
  string status = 6;
  string bio = 7;
  string avatar_thumbnail_url = 8;
  string status_preference = 9;
}

message AvatarEntry {
  string id = 1;
  string user_id = 2;
  string full_url = 3;
  string thumbnail_url = 4;
  string original_filename = 5;
  google.protobuf.Timestamp created_at = 6;
}

message Room {
  string id = 1;
  string name = 2;
  string created_by = 3;
  string voice_server_id = 4;
  string region = 5;
  google.protobuf.Timestamp created_at = 6;
  string description = 7;
  bool is_private = 8;
  int32 slow_mode_interval = 9;
  string category_id = 10;
  int32 position = 11;
  bool archived = 12;
}

message Member {
  string user_id = 1;
  string room_id = 2;
  Role role = 3;
  google.protobuf.Timestamp joined_at = 4;
  string nickname = 5;
  string status = 6;
  int64 last_read_message_id = 7;
}

message VoiceServer {
  string id = 1;
  string name = 2;
  string region = 3;
  string addr_udp = 4;
  string addr_ctrl = 5;
  string status = 6;
  int32 capacity_hint = 7;
  double load_score = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message Message {
  string id = 1;
  string room_id = 2;
  string author_id = 3;
  string content = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp edited_at = 6;
  bool deleted = 7;
  string reply_to_id = 8;
  int32 reply_count = 9;
  repeated MessageAttachment attachments = 10;
  repeated string mentions = 11;
  repeated MessageReaction reactions = 12;
  bool pinned = 13;
  ForwardInfo forward_info = 14;
  string media_group_id = 15;
  string reply_quoted_content = 16;
  optional bool reply_mention_author = 17;
  int32 edit_count = 18;
  Poll poll = 19;
}

message MessageAttachment {
  string id = 1;
  string url = 2;
  string filename = 3;
  string content_type = 4;
  int64 size = 5;
  int32 width = 6;
  int32 height = 7;
  google.protobuf.Timestamp created_at = 8;
}

message MessageReaction {
  string id = 1;
  string message_id = 2;
  string user_id = 3;
  string emoji = 4;
  google.protobuf.Timestamp created_at = 5;
}

message Pagination {
  string cursor = 1;
  int32 limit = 2;
}

message ForwardInfo {
  string original_author_id = 1;
  string original_author_name = 2;
  string original_room_id = 3;
  string original_channel_id = 4;
  string original_message_id = 5;
  google.protobuf.Timestamp original_timestamp = 6;
}

message Poll {
  string id = 1;
  string question = 2;
  repeated PollOption options = 3;
  int32 poll_type = 4;
  bool is_anonymous = 5;
  bool allows_multiple = 6;
  int32 correct_option = 7;
  string explanation = 8;
  google.protobuf.Timestamp close_date = 9;
  bool is_closed = 10;
  int32 total_voters = 11;
  repeated string my_votes = 12;
}

message PollOption {
  int32 option_id = 1;
  string text = 2;
  int32 vote_count = 3;
  repeated string voter_ids = 4;
}

message EditHistoryEntry {
  string id = 1;
  string previous_content = 2;
  google.protobuf.Timestamp edited_at = 3;
  int32 version = 4;
}

message Bookmark {
  string id = 1;
  string message_id = 2;
  string room_id = 3;
  string channel_id = 4;
  string note = 5;
  repeated string tags = 6;
  google.protobuf.Timestamp created_at = 7;
  Message message_snapshot = 8;
}

message ScheduledMessage {
  string id = 1;
  string room_id = 2;
  string channel_id = 3;
  string author_id = 4;
  string content = 5;
  string reply_to_id = 6;
  google.protobuf.Timestamp scheduled_for = 7;
  string status = 8;
  google.protobuf.Timestamp created_at = 9;
}

message Draft {
  string room_id = 1;
  string channel_id = 2;
  string content = 3;
  string reply_to_message_id = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message NotificationOverride {
  string room_id = 1;
  string channel_id = 2;
  string override_level = 3;
  google.protobuf.Timestamp mute_until = 4;
  bool suppress_everyone = 5;
}

message StickerPack {
  string id = 1;
  string name = 2;
  string description = 3;
  string creator_id = 4;
  repeated Sticker stickers = 5;
}

message Sticker {
  string id = 1;
  string pack_id = 2;
  string name = 3;
  string tags = 4;
  int32 format_type = 5;
  string file_url = 6;
  int32 width = 7;
  int32 height = 8;
}

message MediaItem {
  string message_id = 1;
  int32 media_type = 2;
  string file_url = 3;
  string thumbnail_url = 4;
  string mime_type = 5;
  int32 width = 6;
  int32 height = 7;
  google.protobuf.Timestamp created_at = 8;
}