syntax = "proto3";

package concord.auth.v1;

option go_package = "github.com/Alexander-D-Karpov/concord/api/gen/go/auth/v1;authv1";

import "google/api/annotations.proto";

message LoginPasswordRequest {
  string handle = 1;
  string password = 2;
}

message LoginOAuthRequest {
  string provider = 1;
  string code = 2;
  string redirect_uri = 3;
  // state is the opaque value returned by OAuthBegin. The server uses it to
  // recover the per-request PKCE verifier and to bind the exchange to the
  // provider/redirect_uri chosen at begin time. It is single-use.
  string state = 4;
}

message Token {
  string access_token = 1;
  int64 expires_in = 2;
  string refresh_token = 3;
  string token_type = 4;
}

message RefreshRequest {
  string refresh_token = 1;
}

message LogoutRequest {
  string refresh_token = 1;
}

message OAuthBeginRequest {
  string provider = 1;
  string redirect_uri = 2;
}

message OAuthBeginResponse {
  string auth_url = 1;
  string state = 2;
}

message RegisterRequest {
  string handle = 1;
  string password = 2;
  string display_name = 3;
}

message EmptyResponse {}

// AuthMethod describes one login option the server currently offers. type is
// "password" or "oauth". For oauth methods, icon is a client-side icon hint and
// begin_path is the relative path to call to start the flow (OAuthBegin).
message AuthMethod {
  string id = 1;
  string type = 2;
  string display_name = 3;
  string icon = 4;
  string begin_path = 5;
}

message ListAuthMethodsRequest {}

message ListAuthMethodsResponse {
  repeated AuthMethod methods = 1;
}

service AuthService {
  rpc ListAuthMethods(ListAuthMethodsRequest) returns (ListAuthMethodsResponse) {
    option (google.api.http) = {
      get: "/v1/auth/methods"
    };
  }
  rpc Register(RegisterRequest) returns (Token) {
    option (google.api.http) = {
      post: "/v1/auth/register"
      body: "*"
    };
  }
  rpc LoginPassword(LoginPasswordRequest) returns (Token) {
    option (google.api.http) = {
      post: "/v1/auth/login"
      body: "*"
    };
  }
  rpc LoginOAuth(LoginOAuthRequest) returns (Token) {
    option (google.api.http) = {
      post: "/v1/auth/oauth"
      body: "*"
    };
  }
  rpc OAuthBegin(OAuthBeginRequest) returns (OAuthBeginResponse) {
    option (google.api.http) = {
      post: "/v1/auth/oauth/begin"
      body: "*"
    };
  }
  rpc Refresh(RefreshRequest) returns (Token) {
    option (google.api.http) = {
      post: "/v1/auth/refresh"
      body: "*"
    };
  }
  rpc Logout(LogoutRequest) returns (EmptyResponse) {
    option (google.api.http) = {
      post: "/v1/auth/logout"
      body: "*"
    };
  }
}